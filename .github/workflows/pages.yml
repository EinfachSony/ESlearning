name: Publish Spanish trainer
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve original audio assets
        uses: actions/checkout@v4
        with:
          repository: CRewrie/Sony_learning
          ref: 113568b908544e74448c98977aea13ee1fd32063
          path: original
          sparse-checkout: audio
      - name: Prepare static site
        run: |
          cp -R original/audio web/audio
          touch web/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
